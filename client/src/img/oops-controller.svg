<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img" aria-label="A surprised game controller with an unplugged cable">
  <style>
    .drop { animation: drop 900ms cubic-bezier(0.3, 1.5, 0.5, 1) both; transform-origin: 120px 120px; }
    .wig { animation: wig 2.4s ease-in-out 900ms infinite; transform-origin: 120px 110px; }
    .cable { animation: sway 2.8s ease-in-out infinite; transform-origin: 120px 54px; }
    .eye { animation: blink 3.6s infinite; transform-box: fill-box; transform-origin: center; }
    .pupil { animation: look 4s ease-in-out infinite; }
    .mouth { animation: oh 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spark { animation: spark 1.1s steps(1, end) infinite; }
    .shadow { animation: shade 2.4s ease-in-out 900ms infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes drop { from { transform: translateY(-70px) rotate(-10deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes wig { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
    @keyframes sway { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @keyframes look { 0%, 100% { transform: translateX(0); } 30% { transform: translateX(-2px); } 65% { transform: translateX(2px); } }
    @keyframes oh { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3, 0.9); } }
    @keyframes spark { 0% { opacity: 0; } 20% { opacity: 1; } 40% { opacity: 0; } 60% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes shade { 0%, 100% { transform: scaleX(1); opacity: 0.25; } 50% { transform: scaleX(0.92); opacity: 0.2; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c" />
      <stop offset="1" stop-color="#e87d0e" />
    </linearGradient>
  </defs>
  <ellipse class="shadow" cx="120" cy="162" rx="62" ry="7" fill="#000" opacity="0.25" />
  <g class="drop">
    <g class="wig">
      <g class="cable">
        <path d="M120 54 C122 30 74 42 62 24" fill="none" stroke="#d9d9d9" stroke-width="4" stroke-linecap="round" />
        <g transform="translate(62 24) rotate(-35)">
          <rect x="-10" y="-20" width="20" height="14" rx="3" fill="#9a9a9a" />
          <rect x="-6" y="-26" width="4" height="7" rx="1" fill="#c9c9c9" />
          <rect x="2" y="-26" width="4" height="7" rx="1" fill="#c9c9c9" />
        </g>
        <g class="spark" fill="none" stroke="#ffd24d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M44 6 l-4 8 l6 1 l-4 8" />
          <path d="M70 2 l3 5 M36 24 l-6 -1" />
        </g>
      </g>
      <path d="M62 78 C62 62 80 54 100 54 H140 C160 54 178 62 178 78 L190 126 C193 142 176 150 164 142 L146 120 H94 L76 142 C64 150 47 142 50 126 Z" fill="url(#body)" stroke="#7a3a00" stroke-width="3" stroke-linejoin="round" />
      <path d="M79 74 h6 v6 h6 v6 h-6 v6 h-6 v-6 h-6 v-6 h6z" fill="#5a2a00" transform="translate(0 2)" />
      <circle cx="158" cy="75" r="4" fill="#2bd9a5" />
      <circle cx="167" cy="84" r="4" fill="#ff4d4d" />
      <circle cx="158" cy="93" r="4" fill="#ffd24d" />
      <circle cx="149" cy="84" r="4" fill="#4d79ff" />
      <circle cx="100" cy="106" r="9" fill="#5a2a00" />
      <circle cx="100" cy="106" r="5" fill="#3a1a00" />
      <circle cx="140" cy="106" r="9" fill="#5a2a00" />
      <circle cx="140" cy="106" r="5" fill="#3a1a00" />
      <g class="eye"><circle cx="110" cy="80" r="6.500" fill="#fff" /><circle class="pupil" cx="110" cy="81" r="3" fill="#1b130d" /></g>
      <g class="eye"><circle cx="130" cy="80" r="6.500" fill="#fff" /><circle class="pupil" cx="130" cy="81" r="3" fill="#1b130d" /></g>
      <ellipse class="mouth" cx="120" cy="97" rx="4.500" ry="5.500" fill="#3a1a00" />
    </g>
  </g>
</svg>
